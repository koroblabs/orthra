# cargo-about: the licenses of every crate linked into orthra, written into each release archive as
# THIRD-PARTY-LICENSES.md (`.github/workflows/release.yml`, `tools/dist/pack.sh`). The licenses
# accepted are deny.toml's, with its two exceptions: MPL-2.0 for spellbook and CDLA-Permissive-2.0
# for webpki-roots. MPL-2.0 asks that a binary say where the source is: each crate is listed with
# its repository.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# The platforms a release is built for: a crate only another platform links is not in the binary.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# What builds orthra or tests it is not in what is shipped.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Crates published without their license files, whose texts cargo-about would fill in from the
# license's template (`Copyright (c) <year> <copyright holders>`). These are the files at the commit
# each was published from (`.cargo_vcs_info.json`), relative to the repository's root, fetched when
# the list is generated and checked against their SHA-256. A new version whose file changed fails
# the generation until its checksum is written here.
[candle-core.clarify]
license = "MIT OR Apache-2.0"
[[candle-core.clarify.git]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3"
[[candle-core.clarify.git]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
