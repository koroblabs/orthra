# The context tier's default model: ELECTRA-small's generator, from Google, 13.5 million
# parameters. `orthra model install small` installs it, and so does a server whose settings turn
# the context tier on. Its f32 weights are fetched, checked and quantized to Q8_0 here, into one
# file of 15 MB. On the GitHub Typo Corpus it put the right correction first 71.4 % of the time,
# against 68.6 % for the lexical order (`docs/04-context.md` §4).
#
# The version is the source's revision and then orthra's own revision of the model file: a new
# quantization, prior or file format is a new version, installed beside the old one.
version = "electra-small-generator.51a5c11.1"
# How much the lexical order counts beside the model: `prior · −ln(position + 1)`, tuned on half
# of the typo sample and measured on the other half.
prior = 0.25

