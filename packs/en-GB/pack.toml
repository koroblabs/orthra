# en-GB: built by tools/packs.py from the sources in SOURCES.md. Do not edit by hand.
tag = "en-GB"
script = "Latn"
# Compiled when orthra is, to every form the `.aff` and `.dic` make: an FST read where it is
# embedded, which spellbook's tables, 4 MB of memory, are not.
dictionary = { compiled = "en_GB" }
# English's known typos, technical vocabulary and frequencies are en-US's: shared, not copied.
typos = "../en-US/typos.tsv"
frequency = "../en-US/frequency.txt"
# A word the pack accepts, of four letters or more, with one of these before it is accepted as a
# rare word is: `unconfigured`, `refetched`, `subpool`, `multihost`, `libmagic`.
prefixes = ["auto", "lib", "multi", "non", "over", "pre", "re", "sub", "un", "under"]
# A vocabulary word, which no dictionary inflects, with one of these after it is accepted the same
# way: `datagrams`, `demuxes`, and software English's `mmap'd`, `malloc'ed`, `realloc'ing`.
vocabulary-suffixes = ["s", "es", "'d", "'ed", "'ing"]
# Endings a suffix does not follow: a word ending in one of these takes `es`, so `autofocuss` and
# `regexs` are no words.
suffix-not-after = { s = ["s", "x", "z", "ch", "sh"] }
# Two words written with no space between are accepted the same way when each has four letters or
# more and is among the words written most, SCOWL's two commonest sizes: `statuscode`, joined as
# code joins words. A typo seldom splits into two such words, and a known typo is answered first.
compounds = { letters = 4, ranks = 2 }
vocabulary = ["../en-US/vocabulary.txt", "../en-US/vocabulary.orthra.txt", "../en-US/vocabulary.code.txt"]
# The names of commands, accepted as rare words are and never offered: en-US's, shared.
rare-words = ["../en-US/commands.txt"]
word-internal = ["'", "’"]
normalize = { "’" = "'" }
# A comment line that starts with one of these and a colon names people, not prose:
# `# Author: Jens Getreu <...>`.
name-labels = ["author", "authors", "contributor", "contributors", "credits", "maintainer", "maintainers", "original author", "written by"]
# A comment line that starts with one of these, colon or not, names people too: `Copyright (c)
# 2009 Salvatore Sanfilippo`, and Xcode's `Created by Olivier Poitrey on 9/21/09.`
name-lines = ["copyright", "created by"]
